; PlatformIO Project Configuration File for ESP32-S3 WPS Password Fetcher
; Target: ESP32-S3 (16MB Flash, 8MB Octal PSRAM)
; Hardware: ESP32-S3-DevKitC-1-N16R8 on COM4

[platformio]
default_envs = esp32s3
src_dir = src
include_dir = include

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc1-n16r8
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=0
    -D ARDUINO_USB_MODE=0


